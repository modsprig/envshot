[package]
name = "envshot-ffi"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Versioned C ABI over UTF-8 JSON buffers for EnvShot (publish disabled pending release)"

[lib]
name = "envshot_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
envshot = { path = "../envshot", version = "1.0.0" }
envshot-core = { path = "../envshot-core", version = "1.0.0" }
envshot-model = { path = "../envshot-model", version = "1.0.0" }
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1.11.0"

# The C ABI boundary uses #[unsafe(no_mangle)] exports and unsafe extern fns
# by definition; unsafe is confined to buffer management in lib.rs.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
